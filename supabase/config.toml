# Funciones que reciben llamados sin la sesión de Supabase: cada una valida su propia clave.
# gmail: vuelta de Google (GET), sesión del usuario (POST) o clave del programador diario (X-Cron-Secret).
[functions.gmail]
verify_jwt = false

[functions.gmail-push]
# Lo llama Google Pub/Sub con su propio token (OIDC): la función verifica firma, audiencia y cuenta de servicio.
verify_jwt = false

[functions.notificaciones]
# La llama la app de Android con su propio token de dispositivo (X-Device-Token).
verify_jwt = false

[functions.mercadopago]
# Vuelta de Mercado Pago (GET) o sesión del usuario (POST): la función valida cada pedido.
verify_jwt = false
